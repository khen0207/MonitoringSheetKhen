:root{--bg:#0b0b0b;--card:#161616;--tx:#f4f4f4;--mu:#a1a1a1;--bd:#2f2f2f;--ac:#facc15;--ac2:#3b3200;--wr:#facc15;--rd:#f87171;--okbg:#14532d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 16px 18px;background:linear-gradient(135deg,#000,#2a2200);color:#facc15;border-bottom:3px solid #facc15;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(250,204,21,.2)}h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:12px}header .sub{color:#fde68a}
nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
main{padding:0 10px 40px;max-width:100%;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(250,204,21,.08)}
.card b{display:block;font-size:26px;color:var(--ac)}.card span{color:var(--mu);font-size:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(250,204,21,.08)}
.box h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select,button.b{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer}button.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}button.d{color:var(--rd);border-color:var(--rd)}button.b{border-radius:10px;font-weight:500}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}table.fx{table-layout: fixed;}
th,td{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;white-space:normal;word-break: break-word;vertical-align: middle}th{color:var(--ac);font-weight:600}
td select,td input{width:100%;min-width:0;padding:3px 2px;font-size:11px}
.bar{height:8px;background:var(--bd);border-radius:4px;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#eab308,#facc15);border-radius:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ac2);color:var(--ac)}
tr.ok td{background:var(--okbg);box-shadow:inset 3px 0 0 #16a34a}tr.sep td{opacity:.55}tr.ok td:nth-child(3){font-weight:700;color:#4ade80}.okc b{color:#4ade80}td select:disabled{opacity:.6}
tr.res td{background:#7f1d1d!important;box-shadow:inset 3px 0 0 #ef4444;color:#fecaca}tr.res td:nth-child(3){color:#fecaca;font-weight:700}
summary{cursor:pointer;color:var(--ac)}
.pr{display:none}
#printarea{display: none}
@media print{body.pl header,body.pl nav,body.pl main{display:none!important}body.pl #printarea{display:block}#printarea h2{color:#000;margin:0 0 4px}#printarea .sub{color:#333;margin-bottom:8px}#printarea th,#printarea td{white-space:normal}.pgb{page-break-before:always}tr{break-inside: avoid}}
